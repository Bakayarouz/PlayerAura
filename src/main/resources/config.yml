auras:
  # Static single-model aura example
  halo:
    material: PAPER
    item-model: "minecraft:halo_model"
    permission: "aura.use.halo"
    scale: 1.0
    offset:
      x: 0.0
      y: 0.5
      z: 0.0
    billboard: VERTICAL

  # Multi-frame animated aura example
  spinning_fire:
    material: PAPER
    frames:
      - "minecraft:fire_frame_1"
      - "minecraft:fire_frame_2"
      - "minecraft:fire_frame_3"
      - "minecraft:fire_frame_4"
    frame-delay: 5 # Switches frames every 5 ticks (4 times a second)
    permission: "aura.use.fire"
    scale: 1.2
    offset:
      x: 0.0
      y: 0.6
      z: 0.0
    billboard: CENTER
